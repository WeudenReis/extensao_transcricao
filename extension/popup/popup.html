<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>chatPro Reuniões</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topo">
      <span class="marca">chatPro</span>
      <span class="sub">Reuniões</span>
    </header>

    <main>
      <section class="bloco">
        <h2>Conta Google</h2>
        <p class="ajuda">
          É com ela que o link da reunião é criado. Funciona com conta pessoal.
        </p>
        <div id="google-estado" class="estado" role="status">Verificando…</div>
        <button id="conectar" class="botao primario" type="button">Conectar conta Google</button>
        <button id="desconectar" class="botao secundario oculto" type="button">Desconectar</button>
      </section>

      <section class="bloco">
        <h2>Servidor</h2>
        <label class="campo">
          <span>Endereço</span>
          <input id="backend" type="url" placeholder="http://localhost:3333" spellcheck="false" />
        </label>
        <label class="campo">
          <span>Chave do painel</span>
          <input id="token" type="password" placeholder="PANEL_TOKEN" spellcheck="false" />
        </label>
        <button id="salvar" class="botao primario" type="button">Salvar</button>
        <div id="salvo" class="estado oculto" role="status"></div>
      </section>

      <p class="rodape">
        Abra uma conversa no chatPro e use o botão <strong>reunião</strong> na
        barra do atendimento.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
